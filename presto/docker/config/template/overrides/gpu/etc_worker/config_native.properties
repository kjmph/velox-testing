# Enable cuDF GPU acceleration.
cudf.enabled=true
# Multi-worker config generation changes this to true after applying overrides.
cudf.exchange=false
# Each generated worker receives a unique exchange port.
cudf.exchange.server.port=0000
cudf.memory_resource=async
cudf.streaming_groupby_api_enabled=true

# Compress sufficiently large GPU exchange payloads using the adaptive column
# codec and overlap compression with exchange progress.
cudf.exchange_compression=column-adaptive-freq-pfor-min128
cudf.exchange_compression_pipeline=true
cudf.exchange_compression_pipeline_threads=1
cudf.exchange_compression_min_bytes=16777216
cudf.exchange_compression_safety_margin=1.50

# Avoid per-worker JIT warmup during short benchmark runs.
cudf.jit_expression_enabled=false
cudf.intra_node_exchange=true

# Bound partitioned output and rebatch aggregation input at the profile values
# used by the reference GPU run.
cudf.partitioned_output_batch_rows=10000000
cudf.concat_optimization_enabled=true
cudf.batch_size_min_threshold=40000000

# Use trusted unique-key metadata only when enabled explicitly.
#cudf.distinct_hash_join_enabled=false
